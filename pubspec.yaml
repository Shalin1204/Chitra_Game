name: chaos_canvas
description: A realtime multiplayer drawing-party app with chaos mode, voice rooms, and mini games.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Realtime
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^3.15.0
  cloud_firestore: ^5.6.0

  # Drawing
  perfect_freehand: ^2.0.1

  # Animations
  flutter_animate: ^4.3.0

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Navigation
  go_router: ^13.0.0
  url_launcher: ^6.3.0

  # Utilities
  uuid: ^4.2.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2

  cupertino_icons: ^1.0.2

  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.8
  riverpod_lint: ^2.3.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1A1A2E"
    theme_color: "#1A1A2E"

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/images/
    - assets/sounds/

